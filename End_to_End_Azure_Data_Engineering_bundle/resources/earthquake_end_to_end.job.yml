resources:
  jobs:
    EarthQuake_End_to_End_Job:
      name: EarthQuake_End_to_End_Job
      tasks:
        - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: ../src/notebooks/Ingestion_Bronze.ipynb
            base_parameters:
              catalog_name: earthquake_dev
            source: WORKSPACE
        - task_key: Earthquake_Bronze_Silver
          depends_on:
            - task_key: Ingestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_earthquake_etl.id}
            full_refresh: false
        - task_key: Earthquake_Dashboard
          depends_on:
            - task_key: Earthquake_Bronze_Silver
          dashboard_task:
            subscription: {}
            warehouse_id: a1b262f847c45f88
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
