# This is a Databricks asset bundle definition for End_to_End_Azure_Data_Engineering_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: End_to_End_Azure_Data_Engineering_bundle
  uuid: 8b187436-3cb2-4669-b7bc-d1ddb7a2293a

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ea3e0ec2-eeb2.cloud.databricks.com
    variables:
      catalog: earthquake_dev
      schema: dev
      warehouse_id: a1b262f847c45f88
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-ea3e0ec2-eeb2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mydatainmotion@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mydatainmotion@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: earthquake_prod
      schema: prod
      warehouse_id: a1b262f847c45f88
    permissions:
      - user_name: mydatainmotion@gmail.com
        level: CAN_MANAGE
